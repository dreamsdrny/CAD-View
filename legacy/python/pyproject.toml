[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-workbench-python-prototype"
version = "0.1.0"
description = "Lightweight 2D CAD and PCB/FPC engineering workbench"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.7,<6.9", "ezdxf>=1.3,<2"]

[project.scripts]
cad-workbench = "cad_app.app:main"

[tool.setuptools.packages.find]
include = ["cad_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
